<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skinned phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 360px; height: 640px; position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: {{s.ink}}">
  <img src="{{bg}}" alt="0.1.4 farm view (Sunny Meadow shot, tinted for the level)" style="position: absolute; left: 0; top: 0; width: 360px; height: 640px">
  <div style="position: absolute; inset: 0; background: {{s.tint}}"></div>

  <sc-if value="{{isFarm}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; left: 170px; top: 185px; width: 112px; height: 51px; background: #ACDF7F"></div>
    <div aria-hidden="true" style="position: absolute; left: 170px; top: 185px; width: 112px; height: 51px; background: {{s.tint}}"></div>
    <button aria-label="Harvest: the hive is full, 10 of 10" style="position: absolute; left: 196px; top: 181px; width: 60px; height: 60px; border-radius: 50%; background: #FFFFFF; border: 3px solid {{s.border}}; display: flex; align-items: center; justify-content: center; padding: 0; overflow: hidden"><span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: #FFBF1A"></span><svg style="position: relative" width="40" height="40" viewBox="0 0 24 24" stroke="#331F05" stroke-linejoin="round" aria-hidden="true"><g transform="translate(12 12) rotate(35) scale(0.85)"><path d="M-4.2-1.5V-11M-2.5-1.5V-11M-.8-1.5V-11M.8-1.5V-11M2.5-1.5V-11M4.2-1.5V-11" stroke="#545459" stroke-width="1.3" stroke-linecap="round"/><rect x="-5" y="-1.8" width="10" height="3" rx=".8" fill="#99A8BD" stroke-width="1.3"/><rect x="-2.2" y="1.2" width="4.4" height="2.2" rx=".6" fill="#99A8BD" stroke-width="1.2"/><rect x="-1.7" y="3.4" width="3.4" height="9" rx="1.7" fill="#997347" stroke-width="1.3"/></g></svg></button>
    <button aria-label="Royal Jelly 12, open Store" style="position: absolute; left: 136px; top: 10px; width: 80px; height: 60px; border-radius: 30px; background: {{s.panel}}; border: 3px solid {{s.border}}; display: flex; align-items: center; justify-content: center; gap: 2px; font: 800 16px 'Nunito', sans-serif; color: {{s.ink}}; padding: 0"><span>12</span><svg width="26" height="26" viewBox="0 0 24 24" stroke="#331F05" stroke-linejoin="round" overflow="visible" aria-hidden="true"><g transform="translate(0 -2.6)"><g transform="rotate(60 12 15.4)"><path d="M8.36 13.3 12 15.4v4.2l-3.64 2.1-3.64-2.1v-4.2z" fill="#FFC21F" stroke-width="1.4"/><path d="M15.64 13.3l3.64 2.1v4.2l-3.64 2.1L12 19.6v-4.2z" fill="#FFC21F" stroke-width="1.4"/><path d="M12 7l3.64 2.1v4.2L12 15.4l-3.64-2.1V9.1z" fill="#FFC21F" stroke-width="1.4"/><path d="M12 9.1l1.82 1.05v2.1L12 13.3l-1.82-1.05v-2.1z" fill="#F2A61A" stroke-width=".9"/><path d="M8.36 15.4l1.82 1.05v2.1L8.36 19.6l-1.82-1.05v-2.1z" fill="#F2A61A" stroke-width=".9"/><path d="M15.64 15.4l1.82 1.05v2.1l-1.82 1.05-1.82-1.05v-2.1z" fill="#F2A61A" stroke-width=".9"/></g><path transform="translate(0 1.8)" d="M8.7 8.2 8.2 3.2l2 2L12 1.4l1.8 3.8 2-2-.5 5z" fill="#FFC21F" stroke-width="1.3"/></g></svg><span>+</span></button>
    <sc-for list="{{topIcons}}" as="i" hint-placeholder-count="2">
      <button aria-label="{{i.name}}" style="position: absolute; left: {{i.x}}px; top: 10px; width: 60px; height: 60px; border-radius: 50%; background: {{s.panel}}; border: 3px solid {{s.border}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{s.ink}}" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg></button>
    </sc-for>
    <sc-for list="{{rail}}" as="i" hint-placeholder-count="5">
      <div style="position: absolute; left: {{i.x}}px; top: {{i.y}}px; width: 60px; display: flex; flex-direction: column; align-items: center">
        <button aria-label="{{i.name}}" style="width: 60px; height: 60px; border-radius: 50%; background: {{i.bg}}; border: 3px solid {{s.border}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{i.fg}}" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg></button>
        <span style="font: 800 14px 'Nunito'; color: {{s.label}}; text-shadow: -1px -1px 0 {{s.outline}}, 1px -1px 0 {{s.outline}}, -1px 1px 0 {{s.outline}}, 1px 1px 0 {{s.outline}}">{{i.name}}</span>
      </div>
    </sc-for>
    <div style="position: absolute; left: 10px; right: 10px; top: 534px; height: 96px; box-sizing: border-box; background: {{s.panel}}; border: 3px solid {{s.border}}; border-radius: 18px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px">
      <span style="font: 800 16px 'Nunito'; text-align: center">Worker Swarm Count · Lv 0 / 10</span>
      <button style="min-height: 48px; border-radius: 14px; border: 3px solid {{s.border}}; background: {{s.accent}}; color: {{s.accentInk}}; font: 800 18px 'Nunito'">Upgrade $25</button>
    </div>
  </sc-if>

  <sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(20,12,4,0.55)"></div>
    <section aria-label="Upgrade Shop" style="position: absolute; left: 0; right: 0; top: 84px; bottom: 0; background: {{s.panel}}; border: 3px solid {{s.border}}; border-bottom: 0; border-radius: 22px 22px 0 0; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div><h2 style="margin: 0; font: 800 24px 'Nunito'">Shop</h2><span style="font: 700 14px 'Nunito'; color: {{s.sub}}">You have $1,240</span></div>
        <button aria-label="Close Shop" style="width: 60px; height: 60px; border-radius: 50%; border: 3px solid {{s.border}}; background: {{s.soft}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" stroke="{{s.ink}}" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div style="display: flex; gap: 6px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
          <button style="min-height: 60px; padding: 0 12px; border-radius: 14px; border: 3px solid {{s.border}}; background: {{t.bg}}; color: {{t.fg}}; font: 800 16px 'Nunito'">{{t.name}}</button>
        </sc-for>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px dashed {{s.border}}">
          <div style="flex: 1"><div style="font: 800 16px 'Nunito'">{{r.n}}</div><div style="font: 700 14px 'Nunito'; color: {{s.sub}}">{{r.e}}</div></div>
          <button style="flex: none; width: 84px; min-height: 60px; border-radius: 14px; border: 3px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; font: 800 16px 'Nunito'">{{r.c}}</button>
        </div>
      </sc-for>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"enum","options":["honey","mint","blossom","sky","brass","alpine","grove","cloud"],"default":"honey"},"screen":{"editor":"enum","options":["farm","shop"],"default":"farm"},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      honey:   { panel: '#FFF5DB', ink: '#331F05', sub: '#61574C', accent: '#FFC21F', accentInk: '#331F05', border: '#59380D', label: '#FFF5DB', outline: '#331F05', soft: '#FFFFFF', tint: 'transparent' },
      mint:    { panel: '#EEF8E6', ink: '#1E3A16', sub: '#4A6440', accent: '#9ED685', accentInk: '#1E3A16', border: '#2F5A24', label: '#EEF8E6', outline: '#1E3A16', soft: '#FFFFFF', tint: 'transparent' },
      blossom: { panel: '#F7F0FC', ink: '#2E2240', sub: '#5E5274', accent: '#C7B3ED', accentInk: '#2E2240', border: '#4B3870', label: '#F7F0FC', outline: '#2E2240', soft: '#FFFFFF', tint: 'transparent' },
      sky:     { panel: '#EEF7FC', ink: '#12324A', sub: '#3E5D73', accent: '#8ECDF0', accentInk: '#12324A', border: '#1F4F70', label: '#EEF7FC', outline: '#12324A', soft: '#FFFFFF', tint: 'transparent' },
      brass:   { panel: '#3A2A14', ink: '#FFF5DB', sub: '#E8D9B5', accent: '#FFC21F', accentInk: '#331F05', border: '#D1940D', label: '#FFF5DB', outline: '#331F05', soft: '#4D381A', tint: 'transparent' },
      alpine:  { panel: '#F2F6FA', ink: '#1B2B3A', sub: '#4F6272', accent: '#F4A7C4', accentInk: '#1B2B3A', border: '#2C4459', label: '#F2F6FA', outline: '#1B2B3A', soft: '#FFFFFF', tint: 'rgba(110,150,200,0.22)' },
      grove:   { panel: '#231B33', ink: '#F3EEFF', sub: '#C9BEDF', accent: '#99E6F2', accentInk: '#12202A', border: '#7FD3E0', label: '#F3EEFF', outline: '#140F20', soft: '#2F2545', tint: 'rgba(25,15,55,0.55)' },
      cloud:   { panel: '#FFF9F2', ink: '#3A2A20', sub: '#6A5A4C', accent: '#F2C879', accentInk: '#3A2A20', border: '#9C7A3C', label: '#FFF9F2', outline: '#3A2A20', soft: '#FFFFFF', tint: 'rgba(255,215,235,0.22)' }
    };
    const s = P[this.props.skin] || P.honey;
    const screen = this.props.screen || 'farm';
    const D = {
      worlds: 'M12 6a6 6 0 1 0 0 12a6 6 0 1 0 0-12M1.5 14.5c3 1.5 18 -4 21 -7',
      gear: 'M12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1',
      shop: 'M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0',
      build: 'M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM17 13v8M13 17h8',
      habitat: 'M12 5.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5M12 14v8M12 19c-3 0-5-2-5-4M12 19c3 0 5-2 5-4',
      journal: 'M12 9.5c-3 0-5.5 2.5-5.5 5.5s2.5 6 5.5 6 5.5-3 5.5-6-2.5-5.5-5.5-5.5M7 13.5h10M7 17h10M10 6.5 8.5 3.5M14 6.5l1.5-3',
      impact: 'M5 19C5 10 11 5 20 4c0 9-5 15-13 15zM5 19l8-8'
    };
    const ic = (name, x, y, d, hot) => ({ name, x, y, d, bg: hot ? s.accent : s.panel, fg: hot ? s.accentInk : s.ink });
    return {
      s,
      bg: screen === 'shop' ? '/_blob/307f54ef490d522affb7cf7eba22cf25' : '/_blob/8069b78a7bfc41a499f9caab5e3b3d10',
      isFarm: screen === 'farm',
      isShop: screen === 'shop',
      topIcons: [{ name: 'Worlds', x: 222, d: D.worlds }, { name: 'Settings', x: 288, d: D.gear }],
      rail: [ic('Shop', 288, 84, D.shop, true), ic('Build', 288, 168, D.build), ic('Habitat', 288, 252, D.habitat), ic('Journal', 12, 84, D.journal), ic('Impact', 12, 168, D.impact)],
      tabs: [{ name: 'Bees', on: false }, { name: 'Hive', on: true }, { name: 'Habitat', on: false }, { name: 'Research', on: false }].map(t => ({ name: t.name, bg: t.on ? s.accent : s.soft, fg: t.on ? s.accentInk : s.ink })),
      rows: [['Heated Uncapping Fork', '+12% swipe radius · Lv 1/5', '$49', true], ['Centrifuge Gearing', '−15% crank time · Lv 0/5', '$35', true], ['Deep Frame', '2 → 5 jars per frame · Lv 0/3', '$150', false], ['Artisanal Branding', '+$2.50 per jar · Lv 0/10', '$60', true]]
        .map(r => ({ n: r[0], e: r[1], c: r[2], bg: r[3] ? s.accent : s.panel, fg: r[3] ? s.accentInk : s.sub, bd: r[3] ? s.border : s.sub }))
    };
  }
}
</script>
</body>
</html>
