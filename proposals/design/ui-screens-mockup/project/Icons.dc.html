<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 360px; height: 640px; position: relative; font-family: 'Nunito', system-ui, sans-serif; color: #331F05">

  <button aria-label="Royal Jelly 12, open Store" style="position: absolute; left: 136px; top: 10px; width: 80px; height: 60px; border-radius: 30px; background: #FFF5DB; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; gap: 1px; font: 800 16px 'Nunito', sans-serif; color: #331F05; cursor: pointer; padding: 0; flex-direction: row">
    12<svg width="28" height="28" viewBox="0 0 24 24" stroke="#331F05" stroke-linejoin="round" overflow="visible" aria-hidden="true" style="width: 25px; height: 22px"><g transform="translate(0 -2.6)"><g transform="rotate(60 12 15.4)"><path d="M8.36 13.3 12 15.4v4.2l-3.64 2.1-3.64-2.1v-4.2z" fill="#FFC21F" stroke-width="1.4"></path><path d="M15.64 13.3l3.64 2.1v4.2l-3.64 2.1L12 19.6v-4.2z" fill="#FFC21F" stroke-width="1.4"></path><path d="M12 7l3.64 2.1v4.2L12 15.4l-3.64-2.1V9.1z" fill="#FFC21F" stroke-width="1.4"></path><path d="M12 9.1l1.82 1.05v2.1L12 13.3l-1.82-1.05v-2.1z" fill="#F2A61A" stroke-width=".9"></path><path d="M8.36 15.4l1.82 1.05v2.1L8.36 19.6l-1.82-1.05v-2.1z" fill="#F2A61A" stroke-width=".9"></path><path d="M15.64 15.4l1.82 1.05v2.1l-1.82 1.05-1.82-1.05v-2.1z" fill="#F2A61A" stroke-width=".9"></path></g><path transform="translate(0 1.8)" d="M8.7 8.2 8.2 3.2l2 2L12 1.4l1.8 3.8 2-2-.5 5z" fill="#FFC21F" stroke-width="1.3"></path></g></svg><span style="font-size: 18px">+</span>
  </button>
  <button aria-label="Worlds" style="position: absolute; left: 222px; top: 10px; width: 60px; height: 60px; border-radius: 50%; background: #FFF5DB; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#331F05" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle><ellipse cx="12" cy="12" rx="11" ry="3.5" transform="rotate(-20 12 12)"></ellipse></svg>
  </button>
  <button aria-label="Settings" style="position: absolute; left: 288px; top: 10px; width: 60px; height: 60px; border-radius: 50%; background: #FFF5DB; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#331F05" stroke-width="2.2" aria-hidden="true"><path stroke-linejoin="round" d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </button>

  <div style="position: absolute; left: 288px; top: 84px; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 24px">
    <div style="display: flex; flex-direction: column; align-items: center; position: relative">
      <button aria-label="Shop, an upgrade is affordable" onClick="{{onShop}}" style="width: 60px; height: 60px; border-radius: 50%; background: #FFC21F; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#331F05" stroke-width="2.4" aria-hidden="true"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8a3 3 0 0 1 6 0"></path></svg>
      </button>
      <div style="position: absolute; right: -4px; top: -4px; width: 22px; height: 22px; border-radius: 50%; background: #331F05; color: #FFF5DB; font: 800 14px 'Nunito'; display: flex; align-items: center; justify-content: center">!</div>
      <span style="font: 800 14px 'Nunito'; color: #FFF5DB; text-shadow: -1px -1px 0 #331F05, 1px -1px 0 #331F05, -1px 1px 0 #331F05, 1px 1px 0 #331F05">Shop</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center">
      <button aria-label="Build" style="width: 60px; height: 60px; border-radius: 50%; background: #FFF5DB; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#331F05" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="8" height="8"></rect><rect x="13" y="3" width="8" height="8"></rect><rect x="3" y="13" width="8" height="8"></rect><path d="M17 13v8M13 17h8"></path></svg>
      </button>
      <span style="font: 800 14px 'Nunito'; color: #FFF5DB; text-shadow: -1px -1px 0 #331F05, 1px -1px 0 #331F05, -1px 1px 0 #331F05, 1px 1px 0 #331F05">Build</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center">
      <button aria-label="Habitat" style="width: 60px; height: 60px; border-radius: 50%; background: #FFF5DB; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#331F05" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="8" r="2.5"></circle><circle cx="12" cy="3.8" r="1.6"></circle><circle cx="16" cy="8" r="1.6"></circle><circle cx="8" cy="8" r="1.6"></circle><circle cx="12" cy="12.2" r="1.6"></circle><path d="M12 14v8M12 19c-3 0-5-2-5-4M12 19c3 0 5-2 5-4"></path></svg>
      </button>
      <span style="font: 800 14px 'Nunito'; color: #FFF5DB; text-shadow: -1px -1px 0 #331F05, 1px -1px 0 #331F05, -1px 1px 0 #331F05, 1px 1px 0 #331F05">Habitat</span>
    </div>
  </div>

  <div style="position: absolute; left: 12px; top: 84px; width: 60px; display: flex; flex-direction: column; align-items: center; gap: 24px">
    <div style="display: flex; flex-direction: column; align-items: center">
      <button aria-label="Bee Journal" style="width: 60px; height: 60px; border-radius: 50%; background: #FFF5DB; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6.5 8.5 3.5M14 6.5l1.5-3" stroke="#331F05" stroke-width="1.6" stroke-linecap="round" fill="none"></path><ellipse cx="7.5" cy="9" rx="4" ry="2.8" fill="#FFFFFF" stroke="#331F05" stroke-width="1.6"></ellipse><ellipse cx="16.5" cy="9" rx="4" ry="2.8" fill="#FFFFFF" stroke="#331F05" stroke-width="1.6"></ellipse><ellipse cx="12" cy="15" rx="5.5" ry="6" fill="#FFE01A" stroke="#331F05" stroke-width="1.8"></ellipse><path d="M6.8 13.5h10.4M6.9 17h10.2" stroke="#331F05" stroke-width="1.8"></path></svg>
      </button>
      <span style="font: 800 14px 'Nunito'; color: #FFF5DB; text-shadow: -1px -1px 0 #331F05, 1px -1px 0 #331F05, -1px 1px 0 #331F05, 1px 1px 0 #331F05">Journal</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center">
      <button aria-label="Impact and leaderboards" style="width: 60px; height: 60px; border-radius: 50%; background: #FFF5DB; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#331F05" stroke-width="2.2" aria-hidden="true"><path d="M5 19C5 10 11 5 20 4c0 9-5 15-13 15z" fill="#9ED685"></path><path d="M5 19l8-8"></path></svg>
      </button>
      <span style="font: 800 14px 'Nunito'; color: #FFF5DB; text-shadow: -1px -1px 0 #331F05, 1px -1px 0 #331F05, -1px 1px 0 #331F05, 1px 1px 0 #331F05">Impact</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onShop":{"editor":null},"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  renderVals() { return { onShop: this.props.onShop || (() => {}) }; }
}
</script>
</body>
</html>
