<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farm prototype</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
@keyframes forkPulse{0%{transform:scale(1)}40%{transform:scale(1.14)}70%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes forkGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,191,26,.7)}50%{box-shadow:0 0 0 10px rgba(255,191,26,0)}}
.fork-full{animation:forkPulse .7s ease-out 1, forkGlow 1.4s ease-in-out .7s infinite}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #D1940D}
.buy{flex:none;width:84px;min-height:60px;border-radius:14px;border:3px solid #59380D;background:#FFC21F;font:800 16px 'Nunito';color:#331F05;cursor:pointer}
.buy.off{background:#FFF5DB;border-color:#61574C;color:#61574C}
</style>
</helmet>
<div style="width: 360px; height: 640px; position: relative; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; color: #331F05">
  <img src="/_blob/8069b78a7bfc41a499f9caab5e3b3d10" alt="0.1.4 farm view" style="position: absolute; left: 0; top: 0; width: 360px; height: 640px">
  <div aria-hidden="true" style="position: absolute; left: 196px; top: 158px; width: 60px; height: 24px; background: #ACDF7F"></div>
  <div aria-hidden="true" style="position: absolute; left: 170px; top: 185px; width: 112px; height: 51px; background: #ACDF7F"></div>
  <div aria-live="polite" style="position: absolute; left: 186px; top: 158px; width: 80px; text-align: center; font: 800 16px 'Nunito'; color: #FFF5DB; text-shadow: -1.5px -1.5px 0 #331F05, 1.5px -1.5px 0 #331F05, -1.5px 1.5px 0 #331F05, 1.5px 1.5px 0 #331F05">{{n}}/10</div>
  <button class="{{forkClass}}" aria-label="Harvest, hive {{n}} of 10" style="position: absolute; left: 196px; top: 181px; width: 60px; height: 60px; border-radius: 50%; background: #FFFFFF; border: 3px solid #59380D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; overflow: hidden">
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{fillPct}}%; background: #FFBF1A; transition: height .45s ease"></span>
    <svg style="position: relative" width="40" height="40" viewBox="0 0 24 24" stroke="#331F05" stroke-linejoin="round" aria-hidden="true"><g transform="translate(12 12) rotate(35) scale(0.85)"><path d="M-4.2-1.5V-11M-2.5-1.5V-11M-.8-1.5V-11M.8-1.5V-11M2.5-1.5V-11M4.2-1.5V-11" stroke="#545459" stroke-width="1.3" stroke-linecap="round"/><rect x="-5" y="-1.8" width="10" height="3" rx=".8" fill="#99A8BD" stroke-width="1.3"/><rect x="-2.2" y="1.2" width="4.4" height="2.2" rx=".6" fill="#99A8BD" stroke-width="1.2"/><rect x="-1.7" y="3.4" width="3.4" height="9" rx="1.7" fill="#997347" stroke-width="1.3"/></g></svg>
  </button>
  <div style="position: absolute; left: 0; top: 0"><dc-import name="Icons" on-shop="{{openShop}}" hint-size="360px,640px"></dc-import></div>

  <button aria-label="Close Shop" onClick="{{closeShop}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(51,31,5,0.6); opacity: {{dimOpacity}}; pointer-events: {{dimEvents}}; transition: opacity .3s ease"></button>
  <section aria-label="Upgrade Shop" style="position: absolute; left: 0; right: 0; top: 84px; bottom: 0; background: #FFF5DB; border: 3px solid #59380D; border-bottom: 0; border-radius: 22px 22px 0 0; padding: 12px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; transform: translateY({{sheetY}}); transition: transform .38s cubic-bezier(.2,.9,.3,1.05)">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div><h2 style="margin: 0; font: 800 24px 'Nunito'">Shop</h2><span style="font: 700 14px 'Nunito'; color: #61574C">You have $1,240</span></div>
      <button aria-label="Close Shop" onClick="{{closeShop}}" style="width: 60px; height: 60px; border-radius: 50%; border: 3px solid #59380D; background: #FFF5DB; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#331F05" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="row"><div style="flex: 1"><div style="font: 800 16px 'Nunito'">Heated Uncapping Fork</div><div style="font: 700 14px 'Nunito'; color: #61574C">+12% swipe radius · Lv 1/5</div></div><button class="buy">$49</button></div>
    <div class="row"><div style="flex: 1"><div style="font: 800 16px 'Nunito'">Centrifuge Gearing</div><div style="font: 700 14px 'Nunito'; color: #61574C">−15% crank time · Lv 0/5</div></div><button class="buy">$35</button></div>
    <div class="row"><div style="flex: 1"><div style="font: 800 16px 'Nunito'">Deep Frame</div><div style="font: 700 14px 'Nunito'; color: #61574C">2 → 5 jars per frame · Lv 0/3</div></div><button class="buy off">$150</button></div>
    <div class="row"><div style="flex: 1"><div style="font: 800 16px 'Nunito'">Artisanal Branding</div><div style="font: 700 14px 'Nunito'; color: #61574C">+$2.50 per jar · Lv 0/10</div></div><button class="buy">$60</button></div>
    <p style="margin: 4px 0 0; font: 700 14px 'Nunito'; color: #61574C">Tap the dimmed farm or × to close.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":640}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 0, shop: false };
    this.hold = 0;
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const n = this.state.n;
      if (n < 10) { this.setState({ n: n + 1 }); return; }
      this.hold += 1;
      if (this.hold >= 8) { this.hold = 0; this.setState({ n: 0 }); }
    }, 500);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const n = this.state.n;
    const open = this.state.shop;
    return {
      n,
      fillPct: n * 10,
      forkClass: n >= 10 ? 'fork-full' : '',
      openShop: () => this.setState({ shop: true }),
      closeShop: () => this.setState({ shop: false }),
      dimOpacity: open ? 1 : 0,
      dimEvents: open ? 'auto' : 'none',
      sheetY: open ? '0' : '105%'
    };
  }
}
</script>
</body>
</html>
